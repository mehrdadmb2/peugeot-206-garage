name = "peugeot-206-garage-bot"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
GITHUB_OWNER = "mehrdadmb2"
GITHUB_REPO = "peugeot-206-garage"
GITHUB_BRANCH = "main"

# Private document storage. Before deploying with Wrangler, connect the EXISTING
# GARAGE_PRIVATE_KV namespace used by the live Worker. Do not create a new namespace.
# Copy its current ID from Cloudflare Dashboard > Worker > Settings > Bindings,
# then uncomment and fill these lines with that existing ID:
# [[kv_namespaces]]
# binding = "GARAGE_PRIVATE_KV"
# id = "EXISTING_NAMESPACE_ID"
